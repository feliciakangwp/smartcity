# Builds the app and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/nifty-brahmagupta-u20t59]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Login page: hashes the SITE_PASSWORD repository secret (if set) for this build.
      - run: node scripts/hash-password.mjs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Pages has no SPA routing: serving index.html as 404.html lets refreshes on /dashboard etc. work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
